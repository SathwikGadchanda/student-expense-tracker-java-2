name: Java build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and package
        run: mvn -B clean verify
      - name: Check the executable JAR and demo data
        run: java -jar target/campus-lost-found.jar --demo --check-db
      - uses: actions/upload-artifact@v4
        with:
          name: campus-lost-found-runnable
          path: target/campus-lost-found.jar
