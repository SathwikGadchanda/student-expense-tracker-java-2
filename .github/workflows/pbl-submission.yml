name: PBL submission package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pbl-submission.yml'
      - '.github/scripts/**'
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: campus-pbl-submission
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Java and run the real Swing walkthrough
        run: |
          mvn -B clean verify
          java -jar target/campus-lost-found.jar --demo --check-db
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg fonts-dejavu-core
          mkdir -p build-pbl/screens dist
          timeout 60s xvfb-run -a java -cp target/test-classes:target/campus-lost-found.jar edu.campus.DemoWalkthrough build-pbl/screens
          test "$(find build-pbl/screens -name '*.png' | wc -l)" -eq 7
      - name: Generate the slides, report and captioned video
        run: |
          npm install --prefix "$RUNNER_TEMP/pbl" pptxgenjs@3.12.0
          NODE_PATH="$RUNNER_TEMP/pbl/node_modules" node .github/scripts/presentation.cjs build-pbl/screens dist
          python -m pip install reportlab==4.4.1 Pillow==11.2.1 pypdf==5.9.0
          python .github/scripts/report_and_video.py build-pbl/screens dist
          python - <<'PY'
          import zipfile, re
          from pypdf import PdfReader
          with zipfile.ZipFile("dist/Campus_Lost_and_Found_Presentation.pptx") as z:
              assert z.testzip() is None
              assert sum(bool(re.fullmatch(r"ppt/slides/slide[0-9]+.xml", n)) for n in z.namelist()) == 12
              assert sum(n.startswith("ppt/media/") for n in z.namelist()) >= 3
          pdf = PdfReader("dist/Campus_Lost_and_Found_Report.pdf")
          doc = " ".join(page.extract_text() for page in pdf.pages)
          for section in ("Abstract", "Use case diagram", "Flowchart", "Testing and results", "References"):
              assert section in doc, section
          print("PRESENTATION_OK 12 slides; REPORT_OK", len(pdf.pages), "pages")
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 dist/Campus_Lost_and_Found_Demo.mp4
      - name: Assemble runnable package and screenshots
        run: |
          cp target/campus-lost-found.jar dist/
          cp run-windows.bat dist/
          cp README.md dist/
          cp docs/PBL.md dist/
          cp docs/LAB_LOG.md dist/
          cp target/surefire-reports/edu.campus.CampusIntegrationTest.txt dist/Integration_Test_Results.txt
          (cd build-pbl/screens && zip -q ../../dist/Campus_Lost_and_Found_Screenshots.zip *.png)
          (cd dist && zip -q Campus_Lost_and_Found_Submission.zip Campus_Lost_and_Found_Presentation.pptx Campus_Lost_and_Found_Report.pdf Campus_Lost_and_Found_Demo.mp4 Campus_Lost_and_Found_Screenshots.zip campus-lost-found.jar run-windows.bat README.md PBL.md LAB_LOG.md Integration_Test_Results.txt)
          unzip -tq dist/Campus_Lost_and_Found_Submission.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pbl-submission-files
          path: dist/
      - name: Publish the verified Java PBL deliverables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=pbl-v1.0.0
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Campus Lost and Found System — PBL submission" --notes "Java 17 desktop application. Includes the executable JAR, 12-slide presentation, report, captioned walkthrough of the actual Swing application, screenshots, test results and submission ZIP."
          fi
